<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d1d"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="btnFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <linearGradient id="btnCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadowBox">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1100" height="360" rx="16" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Connecting Data Flow Arrows -->
  <g stroke="#FF7043" stroke-width="2.5" stroke-dasharray="6,4" fill="none" opacity="0.7">
    <path d="M 270,180 L 370,180"/>
    <path d="M 710,180 L 810,180"/>
  </g>
  <!-- Arrow heads -->
  <polygon points="375,180 365,174 365,186" fill="#FF7043"/>
  <polygon points="815,180 805,174 805,186" fill="#FF7043"/>

  <!-- Node 1: Input CSV Source -->
  <g transform="translate(40, 50)" filter="url(#shadowBox)">
    <rect width="230" height="260" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="46" rx="14" fill="#1e293b"/>
    <rect x="0" y="32" width="230" height="14" fill="#1e293b"/>
    
    <!-- Header Icon & Title -->
    <rect x="18" y="14" width="18" height="18" rx="4" fill="#00B4D8"/>
    <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">INPUT DATASET</text>

    <!-- Content Items -->
    <g transform="translate(20, 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <rect x="0" y="0" width="190" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-size="12" font-weight="600" fill="#E2E8F0">.csv / .txt files</text>

      <text x="4" y="62" font-size="11.5" fill="#94A3B8">&#8226; Millions of rows</text>
      <text x="4" y="82" font-size="11.5" fill="#94A3B8">&#8226; UTF-8 or Windows-1250</text>
      <text x="4" y="102" font-size="11.5" fill="#94A3B8">&#8226; Quoted text (RFC-4180)</text>
      <text x="4" y="122" font-size="11.5" fill="#94A3B8">&#8226; Custom date/time strings</text>
      <text x="4" y="142" font-size="11.5" fill="#94A3B8">&#8226; Any delimiter (, ; | tab)</text>
    </g>
  </g>

  <!-- Node 2: csv2fbext Core Engine -->
  <g transform="translate(370, 30)" filter="url(#shadowBox)">
    <rect width="340" height="300" rx="16" fill="url(#cardGradAccent)" stroke="#FF5722" stroke-width="1.8"/>
    
    <!-- Top Engine Bar -->
    <rect x="0" y="0" width="340" height="52" rx="16" fill="#FF5722" fill-opacity="0.15"/>
    <text x="170" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FF7043" text-anchor="middle" letter-spacing="0.5">
      csv2fbext ENGINE
    </text>

    <!-- Submodules -->
    <g transform="translate(20, 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- Box 1 -->
      <rect x="0" y="0" width="300" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-size="12.5" font-weight="700" fill="#F8FAFC">Fast Streaming CSV Lexer</text>
      <text x="14" y="36" font-size="11" fill="#64748B">64KB I/O buffer &#8226; Zero-copy chunking</text>

      <!-- Box 2 -->
      <rect x="0" y="56" width="300" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="76" font-size="12.5" font-weight="700" fill="#F8FAFC">Schema Inferrer &amp; JSON Engine</text>
      <text x="14" y="92" font-size="11" fill="#64748B">Auto-detect types, scale &amp; length</text>

      <!-- Box 3 -->
      <rect x="0" y="112" width="300" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="132" font-size="12.5" font-weight="700" fill="#F8FAFC">Firebird 5 Alignment (MET_align)</text>
      <text x="14" y="148" font-size="11" fill="#64748B">Strict 2 / 4 / 8-byte natural padding</text>

      <!-- Box 4 -->
      <rect x="0" y="168" width="300" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="188" font-size="12.5" font-weight="700" fill="#F8FAFC">Date / Time / Epoch Calculator</text>
      <text x="14" y="204" font-size="11" fill="#64748B">1858 MJD base &#8226; 0.1ms tick precision</text>
    </g>
  </g>

  <!-- Node 3: Target Output & Firebird Engine -->
  <g transform="translate(810, 50)" filter="url(#shadowBox)">
    <rect width="250" height="260" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="46" rx="14" fill="#1e293b"/>
    <rect x="0" y="32" width="250" height="14" fill="#1e293b"/>

    <!-- Header -->
    <rect x="18" y="14" width="18" height="18" rx="4" fill="#10B981"/>
    <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">FIREBIRD 5 OUTPUT</text>

    <!-- Content Items -->
    <g transform="translate(20, 68)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <rect x="0" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="22" font-size="12.5" font-weight="700" fill="#34D399">&#8226; Binary Table (.ext)</text>

      <rect x="0" y="44" width="210" height="36" rx="8" fill="#0f172a" stroke="#00B4D8" stroke-width="1"/>
      <text x="12" y="66" font-size="12.5" font-weight="700" fill="#38BDF8">&#8226; SQL DDL Script (.sql)</text>

      <rect x="0" y="88" width="210" height="36" rx="8" fill="#0f172a" stroke="#A78BFA" stroke-width="1"/>
      <text x="12" y="110" font-size="12.5" font-weight="700" fill="#C4B5FD">&#8226; Schema Model (.json)</text>

      <text x="4" y="146" font-size="11.5" font-weight="600" fill="#F1F5F9">Ready to query via:</text>
      <text x="4" y="164" font-size="11" font-family="Consolas, monospace" fill="#F59E0B">SELECT * FROM EXT_TBL;</text>
    </g>
  </g>
</svg>
